}

// ---------- Bonus coins: a skill-gated bonus every 300 score, not a free gimme ----------
function maybeScheduleBonusCoin() {
  // schedule it fairly close to arrival (not the full obstacle horizon) so the mode
  // it's placed for is very unlikely to have changed by the time it's reached
  const lookaheadScore = Math.ceil(950 / 12);
  if (score + lookaheadScore >= nextBonusScore) {
    spawnBonusCoin(nextBonusScore);
    nextBonusScore += BONUS_SCORE_INTERVAL;
  }
}

function obstacleTop(o) {
  return (o.type === 'spike' || o.type === 'block') ? GROUND_Y - o.h : o.y;
}

function spawnBonusCoin(milestoneScore) {
  const milestoneDistance = milestoneScore * 12;
  const x = player.x + (milestoneDistance - distance);
  const size = 30;

  // figure out which mode will actually be active when the player gets there —
  // if an un-triggered portal sits between here and the coin, its target wins
  let effectiveMode = mode;
  for (const o of obstacles) {
    if (o.type === 'portal' && !o.triggered && o.x <= x) effectiveMode = o.targetMode;
  }

  let y;
  if (effectiveMode === 'dog') {
    // above ground — still needs a deliberate jump, but well within easy reach of the arc
    y = GROUND_Y - player.size - 55 - Math.random() * 12;
  } else if (effectiveMode === 'ship' || effectiveMode === 'flappy') {
    // off to one side of the channel rather than jammed right against the edge
    y = Math.random() < 0.5 ? CEILING_Y + 44 : GROUND_Y - size - 44;
  } else {
    // spider: parked exactly at one attach point — you must be on the correct side to catch it
    y = Math.random() < 0.5 ? CEILING_Y : GROUND_Y - player.size;
  }
  y = Math.max(CEILING_Y + 2, Math.min(GROUND_Y - size - 2, y));

  // never let it land inside/behind a hazard — nudge it clear (or along the track) if it does
  const isHazard = o => o.type === 'spike' || o.type === 'block' || o.type === 'shipWall' || o.type === 'spiderWall' || o.type === 'pipeWall';
  let tries = 0;
  let coinX = x;
  while (tries < 8 && obstacles.some(o => isHazard(o) && rectsOverlap(coinX - 6, y - 6, size + 12, size + 12, o.x, obstacleTop(o), o.w, o.h))) {
    coinX += size + 18;
    tries++;
  }

  obstacles.push({ type: 'coin', x: coinX, y, w: size, h: size, collected: false });
}

function collectCoins() {
  const pad = 6;
  for (const o of obstacles) {
    if (o.type === 'coin' && !o.collected) {
      if (rectsOverlap(player.x, player.y, player.size, player.size, o.x - pad, o.y - pad, o.w + pad * 2, o.h + pad * 2)) {
        o.collected = true;
        addBones(BONUS_POINTS, '#ffe066');
        spawnPortalBurst('#ffe066');
        AudioEngine.accent(1200);
      }
    }
  }
}

function collectBalloons() {
  const pad = 6;
  for (const o of obstacles) {
    if (o.type === 'balloon' && !o.collected) {
      if (rectsOverlap(player.x, player.y, player.size, player.size, o.x - pad, o.y - pad, o.w + pad * 2, o.h + pad * 2)) {
        o.collected = true;
        balloonsPoppedInZone++;
        spawnPortalBurst(o.color);
        AudioEngine.accent(980);
        if (balloonsPoppedInZone % BALLOONS_PER_BONUS === 0) {
          addBones(BALLOON_BONUS_POINTS, '#ffe066');
          spawnPortalBurst('#ffe066');
          AudioEngine.accent(1400);
        }
      }
    }
  }
}

function collectStar() {
  // the star is tiny — only a slim, generous-feeling margin, no free ride
  const pad = 8;
  for (const o of obstacles) {
    if (o.type === 'star' && !o.collected) {
      if (rectsOverlap(player.x, player.y, player.size, player.size, o.x - pad, o.y - pad, o.w + pad * 2, o.h + pad * 2)) {
        o.collected = true;
        addBones(DRONE_STAR_BONES, '#ffe066');
        spawnPortalBurst('#ffe066');
        AudioEngine.accent(1600);
      }
    }
  }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Spikes are triangles, so test against the real triangle (not its bounding box):
// clipping a corner of a spike's box no longer counts as a hit.
function triangleHit(px, py, pw, ph, spike) {
  const rx = px + 6, ry = py + 6, rw = pw - 12, rh = ph - 12;      // the dog's (slightly forgiving) hitbox
  const left = spike.x + 3, right = spike.x + spike.w - 3;         // spike, trimmed a hair at the base...
  const top = GROUND_Y - spike.h + 3, bottom = GROUND_Y;           // ...and at the tip
  if (ry + rh <= top || ry >= bottom || rx + rw <= left || rx >= right) return false;
  // the spike is widest at the lowest point the hitbox reaches, so only that slice matters
  const yb = Math.min(ry + rh, bottom);
  const half = ((right - left) / 2) * (yb - top) / (bottom - top);
  const cx = (left + right) / 2;
  return rx < cx + half && rx + rw > cx - half;
}

function checkCollisions() {
  const pad = 5;

  // portals: always checked, never lethal
  for (const o of obstacles) {
    if (o.type === 'portal' && !o.triggered) {
      if (rectsOverlap(player.x, player.y, player.size, player.size, o.x, 0, o.w, H)) {
        o.triggered = true;
        setMode(o.targetMode);
      }
    }
  }

  // brief invincibility right after a mode switch so the transition never feels glitchy —
  // but this must only suppress *lethal* checks, never physics resolution (like landing on
  // a block), or the player falls straight through obstacles during the window and then
  // snaps/dies unfairly the instant it ends
  const invincible = grace > 0;

  if (mode === 'dog' || mode === 'frog') {
    for (const o of obstacles) {
      if (o.type === 'spike') {
        if (!invincible && triangleHit(player.x, player.y, player.size, player.size, o)) return true;
      } else if (o.type === 'block') {
        const by = GROUND_Y - o.h;
        const landingOnTop =
          player.vy >= 0 &&
          player.x + player.size - pad > o.x &&
          player.x + pad < o.x + o.w &&
          player.y + player.size <= by + 14 &&
          player.y + player.size + player.vy >= by - 2;
        if (landingOnTop) {
          player.y = by - player.size;
          player.vy = 0;
          player.grounded = true;
          continue;
        }
        if (!invincible && rectsOverlap(player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2, o.x, by, o.w, o.h)) {
          return true;
        }
      }
    }
  } else if (invincible) {
    return false;
  } else if (mode === 'ship' || mode === 'drone') {
    for (const o of obstacles) {
      if (o.type === 'shipWall') {
        if (rectsOverlap(player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2, o.x, o.y, o.w, o.h)) {
          return true;
        }
      }
    }
  } else if (mode === 'spider') {
    for (const o of obstacles) {
      if (o.type === 'spiderWall') {
        if (rectsOverlap(player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2, o.x, o.y, o.w, o.h)) {
          return true;
        }
      }
    }
  } else {
    // flappy/balloon: touching the ceiling/floor is lethal, same as hitting a pipe
    if (player.y <= CEILING_Y - 2 || player.y + player.size >= GROUND_Y + 2) return true;
    for (const o of obstacles) {
      if (o.type === 'pipeWall') {
        if (rectsOverlap(player.x + pad, player.y + pad, player.size - pad * 2, player.size - pad * 2, o.x, o.y, o.w, o.h)) {
          return true;
        }
      }
    }
  }
  return false;
}

function recordScore() {
  lastRunNewBest = score > 0 && score > getLevelBest(levelIndex);
  if (lastRunNewBest) setLevelBest(levelIndex, score);
  if (score > best) {
    best = score;
    localStorage.setItem('dogdash_best', String(best));
  }
  bestEl.textContent = 'BEST: ' + getLevelBest(levelIndex);
}

function die() {
  gameOver = true;
  running = false;
  thrustHeld = false;
  flashTimer = 10;
  shakeTimer = 16;
  spawnDeathBurst();
  playerExploded = true;
  AudioEngine.crash();
  recordScore();
  syncHudButtons();
  // a short beat to see what got you before the crash screen covers it
  clearTimeout(deathTimer);
  deathTimer = setTimeout(showDeathOverlay, 650);
}

function showDeathOverlay() {
  currentScreen = 'death';
  deathShownAt = performance.now();
  const lvBest = getLevelBest(levelIndex);
  const isChaos = levelIndex === CHAOS_LEVEL;
  const canRetry = !isLevelLocked(levelIndex);
  const canRevive = points >= REVIVE_POINT_COST;
  const keyHint = window.matchMedia && matchMedia('(hover: hover)').matches
    ? '<div class="keysLine">Space / Enter retry · Esc levels</div>' : '';
  overlay.innerHTML = `
    <div class="menuInner">
      <h1 class="${lastRunNewBest ? 'newBest' : ''}">${lastRunNewBest ? '🏆 NEW BEST!' : '💀 CRASHED'}</h1>
      <div class="scoreBig">${score}</div>
      <div class="menuStats">${LEVELS[levelIndex].label} &nbsp;·&nbsp; best ${lvBest}${runBones ? ` &nbsp;·&nbsp; +${runBones} 🦴 this run` : ''} &nbsp;·&nbsp; 🦴 ${points}</div>
      <div class="deathButtons">
        <button id="restartBtn" class="btnPrimary" ${canRetry ? '' : 'disabled'}>↻ RETRY${isChaos ? `<small>${canRetry ? CHAOS_COST + ' 🦴' : 'need ' + CHAOS_COST + ' 🦴'}</small>` : ''}</button>
        <button id="reviveBtn" class="btnRevive" ${canRevive ? '' : 'disabled'}>❤️ REVIVE<small>${canRevive ? 'carry on from here · ' : 'need '}${REVIVE_POINT_COST} 🦴</small></button>
      </div>
      <div class="menuRow">
        <button id="menuBtn" class="btnGhost">☰ LEVELS</button>
        <button id="deathShopBtn" class="btnGhost">🛍️ SKINS</button>
      </div>
      ${keyHint}
    </div>`;
  overlay.style.display = 'flex';
  syncHudButtons();
}

function revive(cost) {
  if (!gameOver || points < cost) return;
  clearTimeout(deathTimer);
  points -= cost;
  savePoints();
  updateBonesUI();

  // clear the immediate danger ahead so the revive doesn't just re-kill you instantly
  obstacles = obstacles.filter(o => o.type === 'portal' || o.x > player.x + 260 || o.x + o.w < player.x - 60);
  grace = GRACE_FRAMES * 2;
  thrustHeld = false;

  if (mode === 'dog' || mode === 'frog') {
    resetPlayer();
  } else if (mode === 'ship' || mode === 'flappy' || mode === 'balloon' || mode === 'drone') {
    player.y = (CEILING_Y + GROUND_Y) / 2 - player.size / 2;
    player.vy = 0;
    player.rotation = 0;
  } else {
    spiderSide = 'bottom';
    player.y = GROUND_Y - player.size;
    player.vy = 0;
  }

  flashTimer = 0;
  shakeTimer = 0;
  playerExploded = false;
  gameOver = false;
  running = true;
  currentScreen = 'game';
  overlay.style.display = 'none';
  spawnPortalBurst('#7fffb0');
  syncHudButtons();
}

function startGame() {
  if (isLevelLocked(levelIndex)) { showMenu(); return; }
  AudioEngine.start();
  clearTimeout(deathTimer);
  overlay.style.display = 'none';
  shopOverlay.style.display = 'none';
  hint.style.display = 'none';
  currentScreen = 'game';
  if (levelIndex === CHAOS_LEVEL) { points -= CHAOS_COST; savePoints(); updateBonesUI(); }
  // Chaos = INSANITY (costs bones per run); every other level's difficulty ramps up level by level.
  DIFF = levelDifficulty(levelIndex);
  obstacles = [];
  particles = [];
  floatTexts = [];
  nextObstacleX = W + 200;
  baseSpeed = 6.4 * DIFF.baseSpeedMult;
  SPEED_RAMP_MAX = SPEED_RAMP_CAP_DISTANCE / DIFF.speedRampDiv;
  speed = baseSpeed;
  score = 0;
  distance = 0;
  hud.textContent = '0';
  lastPointTier = 0;
  runBones = 0;
  nextBonusScore = BONUS_SCORE_INTERVAL;
  gameOver = false;
  running = true;
  paused = false;
  playerExploded = false;
  shakeTimer = 0;
  flashTimer = 0;
  mode = 'dog';
  thrustHeld = false;
  coyote = 0;
  spiderSide = 'bottom';
  balloonsSpawnedInZone = 0;
  balloonsPoppedInZone = 0;
  frogSpikeStreak = 0;
  droneStarSpawned = false;
  grace = 0;
  ALL_MODES = LEVEL.modes.slice();
  applyLevelTheme();
  zoneMode = 'dog';
  zoneRemaining = 1600;
  modeBadge.textContent = MODE_LABEL.dog;
  modeBadge.style.background = 'rgba(0,0,0,0.35)';
  modeBadge.style.borderColor = 'rgba(255,255,255,0.3)';
  resetPlayer();
  ensureObstacles();
  syncHudButtons();
}

// the pause button only makes sense mid-run
function syncHudButtons() {
  pauseBtn.style.display = running && !gameOver ? 'flex' : 'none';
}

// ---------- Pause (button, Esc / P, or automatically when the app goes to the background) ----------
const pauseBannerEl = document.getElementById('pauseBanner');
const activePointers = new Set();
function pauseGame() {
  activePointers.clear();
  thrustHeld = false;
  if (!running || gameOver || paused) return;
  paused = true;
  pauseBannerEl.style.display = 'flex';
  AudioEngine.pauseAudio();
}
function resumeFromPause() {
  paused = false;
  pauseBannerEl.style.display = 'none';
  lastLoopTime = 0; stepAccum = 0;
  AudioEngine.resumeAudio();
}
function autoPauseGame() {
  activePointers.clear();
  thrustHeld = false;
  AudioEngine.pauseAudio();
  if (running && !gameOver) { paused = true; pauseBannerEl.style.display = 'flex'; }
}
function quitRun() {
  if (!running) return;
  recordScore();
  running = false;
  gameOver = false;
  paused = false;
  pauseBannerEl.style.display = 'none';
  AudioEngine.resumeAudio();
  showMenu();
}
pauseBtn.addEventListener('click', pauseGame);
document.getElementById('quitBtn').addEventListener('click', quitRun);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) autoPauseGame();
  else if (!paused) { lastLoopTime = 0; stepAccum = 0; AudioEngine.resumeAudio(); }
});
window.addEventListener('pagehide', autoPauseGame);
window.addEventListener('blur', () => { activePointers.clear(); thrustHeld = false; });

// ---------- Keyboard ----------
const JUMP_KEYS = new Set(['Space', 'ArrowUp', 'KeyW']);
window.addEventListener('keydown', (e) => {
  const k = e.code;
  const isJump = JUMP_KEYS.has(k);
  const isEnter = k === 'Enter' || k === 'NumpadEnter';
  if (k === 'KeyM') { if (!e.repeat) toggleMute(); return; }
  if (k === 'Escape' || k === 'KeyP') {
    if (e.repeat) return;
    if (currentScreen === 'shop') closeShop();
    else if (running && !gameOver) { if (paused) resumeFromPause(); else pauseGame(); }
    else if (currentScreen === 'death' && k === 'Escape') showMenu();
    return;
  }
  if (!isJump && !isEnter) return;
  // Enter on a visible, focused menu button presses that button (keyboard / Tab users);
  // Space always means "play / jump / retry"
  const focused = document.activeElement;
  if (isEnter && !running && focused && focused.tagName === 'BUTTON' && focused.offsetParent !== null &&
      focused.closest('#overlay, #shopOverlay')) return;
  e.preventDefault();
  if (currentScreen === 'shop') return;
  if (paused) { if (!e.repeat) resumeFromPause(); return; }
  if (running) {
    if (isJump) { if (!e.repeat) jump(); thrustHeld = true; }
    return;
  }
  if (e.repeat) return;
  if (currentScreen === 'death') {
    // small delay so a key still held from the crash doesn't instantly restart
    if (performance.now() - deathShownAt < 350) return;
    if (isLevelLocked(levelIndex)) showMenu(); else startGame();
    return;
  }
  if (currentScreen === 'menu' && !gameOver) startGame();
});
window.addEventListener('keyup', (e) => {
  if (JUMP_KEYS.has(e.code)) thrustHeld = false;
});

// ---------- Touch / mouse: tap anywhere to jump, hold to fly ----------
window.addEventListener('pointerdown', (e) => {
  if (paused) { e.preventDefault(); resumeFromPause(); return; }
  if (!running) return;   // menus and the crash screen handle their own taps
  e.preventDefault();
  activePointers.add(e.pointerId);
  jump();
  thrustHeld = true;
});
function releasePointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) thrustHeld = false;
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

// ---------- Drawing ----------
const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * W,
  y: Math.random() * (H - 150),
  r: Math.random() * 1.5 + 0.4,
  phase: Math.random() * Math.PI * 2
}));

// space-level parallax objects (planets, a saucer ship, a rocket) — positions are
// fractions of screen width so they loop smoothly regardless of canvas size
const spaceObjects = [
  { type: 'planet', xFrac: 0.12, y: 64, r: 24, color: '#ff9a3c', ring: false, mult: 0.22 },
  { type: 'planet', xFrac: 0.55, y: 150, r: 15, color: '#7de3b0', ring: true, mult: 0.4 },
  { type: 'rocket', xFrac: 0.78, y: 190, size: 26, mult: 0.6 },
  { type: 'ship', xFrac: 0.33, y: 105, size: 20, mult: 0.75 },
  { type: 'planet', xFrac: 0.92, y: 38, r: 10, color: '#a06bff', ring: false, mult: 0.3 },
  { type: 'ship', xFrac: 0.68, y: 70, size: 14, mult: 0.9 },
];

const machineObjects = [
  { type: 'gear', xFrac: 0.1, y: 90, r: 34, teeth: 10, color: '#8a97a3', mult: 0.25, dir: 1 },
  { type: 'pipe', xFrac: 0.32, y: 40, w: 130, h: 16, color: '#5a626a', mult: 0.4, vertical: false },
  { type: 'gear', xFrac: 0.5, y: 170, r: 20, teeth: 8, color: '#c9822f', mult: 0.5, dir: -1 },
  { type: 'pipe', xFrac: 0.68, y: 60, w: 16, h: 130, color: '#4a5560', mult: 0.55, vertical: true },
  { type: 'gear', xFrac: 0.85, y: 120, r: 27, teeth: 9, color: '#8a97a3', mult: 0.7, dir: 1 },
  { type: 'gear', xFrac: 0.97, y: 200, r: 14, teeth: 7, color: '#c9822f', mult: 0.85, dir: -1 },
];

function parallaxObjX(obj) {
  const span = W + 300;
  let x = (obj.xFrac * span + bgOffset * obj.mult) % span;
  if (x < -150) x += span;
  return x - 150;
}

function drawPlanet(x, y, r, color, ring) {
  const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.15, color);
  grad.addColorStop(1, 'rgba(0,0,0,0.4)');
  if (ring) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.8, r * 0.5, -0.3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawSpaceship(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#8a97a3';
  ctx.beginPath();
  ctx.ellipse(0, 0, s, s * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(102,224,255,0.6)';
  ctx.beginPath();
  ctx.arc(0, -s * 0.15, s * 0.4, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,224,102,0.5)';
  for (const dx of [-s * 0.6, 0, s * 0.6]) {
    ctx.beginPath();
    ctx.arc(dx, s * 0.15, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawRocket(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.5);
  ctx.fillStyle = `rgba(255,${150 + Math.random() * 40 | 0},60,0.85)`;
  ctx.beginPath();
  ctx.moveTo(-s * 0.12, s * 0.55);
  ctx.lineTo(s * 0.12, s * 0.55);
  ctx.lineTo(0, s * 0.85 + Math.random() * 6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e8544e';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.7);
  ctx.lineTo(s * 0.22, s * 0.1);
  ctx.lineTo(-s * 0.22, s * 0.1);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, -s * 0.15, s * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e8544e';
  ctx.beginPath();
  ctx.moveTo(-s * 0.22, s * 0.1);
  ctx.lineTo(-s * 0.4, s * 0.35);
  ctx.lineTo(-s * 0.15, s * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.22, s * 0.1);
  ctx.lineTo(s * 0.4, s * 0.35);
  ctx.lineTo(s * 0.15, s * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSpaceScene() {
  for (const obj of spaceObjects) {
    const x = parallaxObjX(obj);
    if (obj.type === 'planet') drawPlanet(x, obj.y, obj.r, obj.color, obj.ring);
    else if (obj.type === 'ship') drawSpaceship(x, obj.y, obj.size);
    else if (obj.type === 'rocket') drawRocket(x, obj.y, obj.size);
  }
}

function drawGear(x, y, r, teethCount, color, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(spin);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  const toothW = r * 0.34, toothH = r * 0.3;
  for (let i = 0; i < teethCount; i++) {
    const a = (i / teethCount) * Math.PI * 2;
    ctx.save();
    ctx.rotate(a);
    ctx.fillRect(-toothW / 2, -r - toothH, toothW, toothH);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawPipeDeco(x, y, w, h, color, vertical) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  if (vertical) ctx.fillRect(x + w * 0.2, y, w * 0.2, h);
  else ctx.fillRect(x, y + h * 0.2, w, h * 0.2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  const joints = vertical ? [y + 8, y + h - 8] : [x + 8, x + w - 8];
  joints.forEach(j => {
    ctx.beginPath();
    if (vertical) ctx.arc(x + w / 2, j, 3, 0, Math.PI * 2);
    else ctx.arc(j, y + h / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawMachineScene() {
  for (const obj of machineObjects) {
    const x = parallaxObjX(obj);
    if (obj.type === 'gear') drawGear(x, obj.y, obj.r, obj.teeth, obj.color, frame * 0.015 * obj.dir);
    else if (obj.type === 'pipe') drawPipeDeco(x, obj.y, obj.w, obj.h, obj.color, obj.vertical);
  }
}

const chaosNebula = { x1Frac: 0.25, y1: 90, x2Frac: 0.7, y2: 160 };

function drawMixedScene() {
  // space-dominant mashup: a nebula glow and full-strength planets/ships up front,
  // with faint traces of the meadow and machine levels bleeding through behind it
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = LEVELS[0].mountains[1];
  for (let i = -1; i < 2; i++) drawMountainRow(((bgOffset * 0.35) % W) + i * W, H - 140, 70, 6);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.3;
  drawMachineScene();
  ctx.restore();

  // soft nebula glow behind the planets
  const nx = parallaxObjX({ xFrac: chaosNebula.x1Frac, mult: 0.15 });
  const glow = ctx.createRadialGradient(nx, chaosNebula.y1, 0, nx, chaosNebula.y1, 140);
  glow.addColorStop(0, 'rgba(255,93,158,0.18)');
  glow.addColorStop(1, 'rgba(255,93,158,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H - 100);

  ctx.save();
  ctx.globalAlpha = 0.95;
  drawSpaceScene();
  ctx.restore();
}

function drawBackground() {
  // twinkling stars
  ctx.save();
  for (const s of stars) {
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(frame * 0.02 + s.phase));
    ctx.globalAlpha = LEVEL.noStars ? 0 : tw;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // soft glowing moon (skipped on special-themed levels — their own scenery takes its place)
  if (!LEVEL.special) {
    const moonX = W * 0.8, moonY = 58, moonR = 24;
    const glow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 4);
    glow.addColorStop(0, 'rgba(255,244,214,0.55)');
    glow.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff8e6';
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180,150,190,0.35)';
    ctx.beginPath();
    ctx.arc(moonX - 8, moonY - 4, 5, 0, Math.PI * 2);
    ctx.arc(moonX + 6, moonY + 8, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // layered parallax mountains, far to near — or a themed scene for special levels
  ctx.save();
  bgOffset -= speed * 0.15 * renderFrac;   // never wrapped: every layer wraps itself, so no layer jumps sideways
  if (LEVEL.special === 'space') {
    drawSpaceScene();
  } else if (LEVEL.special === 'machine') {
    drawMachineScene();
  } else if (LEVEL.special === 'theme') {
    drawThemedScene();
  } else if (LEVEL.special === 'mixed') {
    drawMixedScene();
  } else {
    const layers = [
      { mult: 0.35, color: LEVEL.mountains[0], baseY: H - 150, height: 65 },
      { mult: 0.6, color: LEVEL.mountains[1], baseY: H - 132, height: 82 },
      { mult: 1.0, color: LEVEL.mountains[2], baseY: H - 120, height: 95 },
    ];
    for (const layer of layers) {
      ctx.fillStyle = layer.color;
      for (let i = -1; i < 2; i++) {
        drawMountainRow(((bgOffset * layer.mult) % W) + i * W, layer.baseY, layer.height, 6);
      }
    }
  }
  ctx.restore();

  ctx.fillStyle = LEVEL.ground;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = LEVEL.accent;
  ctx.fillRect(0, GROUND_Y, W, 4);

  if (running || gameOver) {
    if (mode === 'ship' || mode === 'drone') {
      ctx.fillStyle = 'rgba(58,209,255,0.55)';
      ctx.fillRect(0, CEILING_Y - 4, W, 4);
    } else if (mode === 'flappy' || mode === 'balloon') {
      // in flappy/balloon the ceiling is deadly, so show it in red
      ctx.fillStyle = 'rgba(255,90,110,0.6)';
      ctx.fillRect(0, CEILING_Y - 4, W, 4);
    }
  }

  groundOffset -= speed * renderFrac;
  if (groundOffset < -40) groundOffset += 40;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let x = groundOffset; x < W; x += 40) {
    ctx.fillRect(x, GROUND_Y + 8, 20, H - GROUND_Y - 8);
  }
}

function drawMountainRow(offset, baseY, height, count) {
  const step = W / count;
  ctx.beginPath();
  ctx.moveTo(offset, H);
  for (let i = 0; i <= count; i++) {
    const x = offset + i * step;
    const y = baseY - Math.sin(i * 1.3) * height - height / 2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(offset + count * step, H);
  ctx.closePath();
  ctx.fill();
}

function drawSpike(o) {
  const y = GROUND_Y;
  ctx.save();
  const grad = ctx.createLinearGradient(o.x, y - o.h, o.x, y);
  grad.addColorStop(0, '#fff2c7');
  grad.addColorStop(1, '#ff9a3c');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(o.x, y);
  ctx.lineTo(o.x + o.w / 2, y - o.h);
  ctx.lineTo(o.x + o.w, y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawBlock(o) {
  const y = GROUND_Y - o.h;
  const grad = ctx.createLinearGradient(o.x, y, o.x, y + o.h);
  grad.addColorStop(0, '#7fd8ff');
  grad.addColorStop(1, '#3c8fd8');
  ctx.fillStyle = grad;
  ctx.fillRect(o.x, y, o.w, o.h);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x + 1, y + 1, o.w - 2, o.h - 2);
}

function drawShipWall(o) {
  const grad = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  grad.addColorStop(0, '#ff6f9c');
  grad.addColorStop(1, '#7a2e8c');
  ctx.fillStyle = grad;
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
}

function drawSpiderWall(o) {
  const grad = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  grad.addColorStop(0, '#3a1f52');
  grad.addColorStop(1, '#12081f');
  ctx.fillStyle = grad;
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = 'rgba(180,107,255,0.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
  // web strand details
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  const edgeY = o.safe === 'bottom' ? o.y + o.h : o.y;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(o.x + 4 + i * (o.w - 8) / 2, o.y + (o.safe === 'bottom' ? o.h * 0.15 : o.h * 0.85));
    ctx.lineTo(o.x + o.w / 2, edgeY);
    ctx.stroke();
  }
}

function drawPipeWall(o) {
  const grad = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
  grad.addColorStop(0, '#3fae5c');
  grad.addColorStop(0.5, '#5fd97e');
  grad.addColorStop(1, '#2f8c48');
  ctx.fillStyle = grad;
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = '#1e5c30';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);

  // pipe cap/rim on the open (gap-facing) end
  const capH = 16;
  const capY = o.cap === 'bottom' ? o.y + o.h - capH : o.y;
  const capGrad = ctx.createLinearGradient(o.x - 4, 0, o.x + o.w + 4, 0);
  capGrad.addColorStop(0, '#2f8c48');
  capGrad.addColorStop(0.5, '#6fe28e');
  capGrad.addColorStop(1, '#256b37');
  ctx.fillStyle = capGrad;
  ctx.fillRect(o.x - 4, capY, o.w + 8, capH);
  ctx.strokeStyle = '#1e5c30';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(o.x - 3, capY + 1, o.w + 6, capH - 2);
}

function drawCoin(o) {
  const cx = o.x + o.w / 2;
  const cy = o.y + o.h / 2 + Math.sin(frame * 0.12 + o.x) * 3;
  const spin = Math.sin(frame * 0.08 + o.x);
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.15 + o.x);

  // vertical beacon strip so it reads clearly against busy backgrounds/obstacles,
  // especially useful when it's tucked near a ceiling/floor edge
  ctx.save();
  const beaconGrad = ctx.createLinearGradient(0, CEILING_Y - 20, 0, GROUND_Y + 4);
  beaconGrad.addColorStop(0, 'rgba(255,224,102,0)');
  beaconGrad.addColorStop(Math.max(0, Math.min(1, (cy - (CEILING_Y - 20)) / (GROUND_Y + 4 - (CEILING_Y - 20)))), `rgba(255,224,102,${0.16 + pulse * 0.1})`);
  beaconGrad.addColorStop(1, 'rgba(255,224,102,0)');
  ctx.fillStyle = beaconGrad;
  ctx.fillRect(cx - 5, CEILING_Y - 20, 10, GROUND_Y + 4 - (CEILING_Y - 20));
  ctx.restore();

  // soft pulsing halo ring behind it
  ctx.save();
  ctx.globalAlpha = 0.25 + pulse * 0.25;
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(cx, cy, o.w * (0.75 + pulse * 0.25), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(Math.max(0.2, Math.abs(spin)), 1);

  ctx.shadowColor = 'rgba(255, 224, 102, 1)';
  ctx.shadowBlur = 24;
  ctx.fillStyle = '#ffe066';
  ctx.strokeStyle = '#8a5a2b';
  ctx.lineWidth = 2.5;
  const r = o.w * 0.26;
  const barLen = o.w * 0.17;
  // bone shape: two lobes joined by a bar
  ctx.beginPath();
  ctx.arc(-barLen, -r * 0.6, r, 0, Math.PI * 2);
  ctx.arc(-barLen, r * 0.6, r, 0, Math.PI * 2);
  ctx.arc(barLen, -r * 0.6, r, 0, Math.PI * 2);
  ctx.arc(barLen, r * 0.6, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-barLen, -r * 0.55, barLen * 2, r * 1.1);
  ctx.shadowBlur = 0;
  ctx.stroke();

  // shine highlight
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(-barLen * 0.3, -r * 0.5, r * 0.35, r * 0.18, -0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBalloon(o) {
  const cx = o.x + o.w / 2;
  const cy = o.y + o.h / 2 + Math.sin(frame * 0.1 + o.x) * 4;
  ctx.save();
  ctx.translate(cx, cy);

  // string
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, o.h * 0.5);
  ctx.quadraticCurveTo(3, o.h * 0.7, 0, o.h * 0.9);
  ctx.stroke();

  ctx.shadowColor = o.color;
  ctx.shadowBlur = 16;
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, o.w * 0.5, o.h * 0.58, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // knot
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(-3, o.h * 0.5);
  ctx.lineTo(3, o.h * 0.5);
  ctx.lineTo(0, o.h * 0.58);
  ctx.closePath();
  ctx.fill();

  // shine highlight
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(-o.w * 0.16, -o.h * 0.2, o.w * 0.14, o.h * 0.2, -0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawPortal(o) {
  const color = MODE_COLOR[o.targetMode];
  const cx = o.x + o.w / 2;
  const pulse = Math.sin(frame * 0.15) * 3;
  ctx.save();
  // a see-through gateway rather than a solid block — you can spot what's
  // waiting on the other side before you actually pass through it
  const grad = ctx.createLinearGradient(o.x - 10, 0, o.x + o.w + 10, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = grad;
  ctx.fillRect(o.x - pulse, CEILING_Y - 20, o.w + pulse * 2, (GROUND_Y - CEILING_Y) + 20);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.strokeRect(o.x, CEILING_Y - 20, o.w, (GROUND_Y - CEILING_Y) + 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText(o.targetMode.toUpperCase(), cx, CEILING_Y - 28);
  ctx.restore();
}

// Draws the square dog centred on (0,0). `colors` defaults to the equipped skin and `c` to the game canvas,
// so the shop can reuse this to draw skin previews.
function drawDogShape(s, colors, c, preview) {
  colors = colors || getSkinColors();
  c = c || ctx;

  c.shadowColor = 'rgba(255, 215, 107, 0.6)';
  c.shadowBlur = preview ? 6 : 14;
  c.fillStyle = colors.body;
  roundRect(-s / 2, -s / 2, s, s, 9, c);
  c.fill();
  c.shadowBlur = 0;

  if (colors.pattern) {
    c.save();
    roundRect(-s / 2, -s / 2, s, s, 9, c);
    c.clip();
    drawFurPattern(c, s, colors);
    c.restore();
  }

  c.strokeStyle = colors.outline;
  c.lineWidth = 2.5;
  roundRect(-s / 2, -s / 2, s, s, 9, c);
  c.stroke();

  c.fillStyle = colors.outline;
  c.beginPath();
  c.moveTo(-s / 2 + 2, -s / 2 + 4);
  c.lineTo(-s / 2 - 8, -s / 2 - 10);
  c.lineTo(-s / 2 + 12, -s / 2 + 2);
  c.closePath();
  c.fill();
  c.beginPath();
  c.moveTo(s / 2 - 2, -s / 2 + 4);
  c.lineTo(s / 2 + 8, -s / 2 - 10);
  c.lineTo(s / 2 - 12, -s / 2 + 2);
  c.closePath();
  c.fill();

  c.fillStyle = colors.snout;
  roundRect(-s * 0.22, s * 0.02, s * 0.44, s * 0.34, 6, c);
  c.fill();

  c.fillStyle = colors.nose;
  c.beginPath();
  c.ellipse(0, s * 0.14, 4, 3, 0, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = colors.eye;
  c.beginPath();
  c.arc(s * 0.12, -s * 0.08, 3.4, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = 'rgba(255,255,255,0.35)';
  c.beginPath();
  c.ellipse(-s * 0.14, -s * 0.18, 8, 6, -0.3, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = colors.tongue;
  roundRect(-3, s * 0.32, 6, 8, 3, c);
  c.fill();

  if (colors.acc) drawAccessory(c, s, colors.acc);
}

// fur markings, clipped to the dog's square body
function drawFurPattern(c, s, colors) {
  c.fillStyle = colors.spot;
  c.strokeStyle = colors.spot;
  switch (colors.pattern) {
    case 'spots': {
      const SPOTS = [[-0.3, -0.28, 0.08], [0.02, -0.38, 0.06], [0.34, -0.3, 0.07], [-0.36, 0.06, 0.065],
                     [0.37, 0.18, 0.08], [-0.3, 0.36, 0.07], [0.3, 0.43, 0.05], [-0.1, -0.2, 0.045]];
      for (const [x, y, r] of SPOTS) { c.beginPath(); c.arc(x * s, y * s, r * s, 0, Math.PI * 2); c.fill(); }
      break;
    }
    case 'saddle': {
      // darker coat over the top and sides, with a pale stripe down the middle of the face
      c.fillRect(-s / 2, -s / 2, s, s * 0.3);
      c.fillRect(-s / 2, -s / 2, s * 0.17, s);
      c.fillRect(s / 2 - s * 0.17, -s / 2, s * 0.17, s);
      c.fillStyle = colors.blaze;
      roundRect(-s * 0.08, -s / 2 - 4, s * 0.16, s * 0.62, s * 0.08, c);
      c.fill();
      break;
    }
    case 'stripes': {
      c.lineWidth = s * 0.07;
      c.lineCap = 'round';
      for (let i = -3; i <= 3; i++) {
        const x = i * s * 0.2;
        c.beginPath();
        c.moveTo(x - s * 0.18, -s / 2 - 2);
        c.quadraticCurveTo(x + s * 0.06, 0, x - s * 0.02, s / 2 + 2);
        c.stroke();
      }
      break;
    }
    case 'panda': {
      c.beginPath();
      c.ellipse(s * 0.12, -s * 0.08, s * 0.15, s * 0.12, -0.4, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.ellipse(-s * 0.2, -s * 0.08, s * 0.12, s * 0.1, 0.4, 0, Math.PI * 2);
      c.fill();
      break;
    }
  }
}

function drawAccessory(c, s, acc) {
  const top = -s / 2;
  c.save();
  c.lineJoin = 'round';
  switch (acc) {
    case 'patch': {
      c.strokeStyle = '#111';
      c.lineWidth = 1.8;
      c.beginPath();
      c.moveTo(-s / 2 + 1, -s * 0.3);
      c.lineTo(s / 2 - 1, s * 0.04);
      c.stroke();
      c.fillStyle = '#111';
      c.beginPath();
      c.ellipse(s * 0.12, -s * 0.08, s * 0.12, s * 0.1, -0.3, 0, Math.PI * 2);
      c.fill();
      break;
    }
    case 'shades': {
      c.fillStyle = '#111';
      roundRect(-s * 0.38, -s * 0.18, s * 0.3, s * 0.16, 3, c); c.fill();
      roundRect(-s * 0.02, -s * 0.18, s * 0.3, s * 0.16, 3, c); c.fill();
      c.fillRect(-s * 0.1, -s * 0.15, s * 0.1, s * 0.04);
      c.fillRect(s * 0.26, -s * 0.16, s * 0.24, s * 0.04);
      c.strokeStyle = 'rgba(255,255,255,0.75)';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(-s * 0.32, -s * 0.07); c.lineTo(-s * 0.24, -s * 0.15);
      c.moveTo(s * 0.04, -s * 0.07); c.lineTo(s * 0.12, -s * 0.15);
      c.stroke();
      break;
    }
    case 'crown': {
      const y0 = top + 3;
      c.fillStyle = '#ffd700';
      c.strokeStyle = '#a8740a';
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(-s * 0.25, y0);
      c.lineTo(-s * 0.25, y0 - s * 0.2);
      c.lineTo(-s * 0.12, y0 - s * 0.09);
      c.lineTo(0, y0 - s * 0.27);
      c.lineTo(s * 0.12, y0 - s * 0.09);
      c.lineTo(s * 0.25, y0 - s * 0.2);
      c.lineTo(s * 0.25, y0);
      c.closePath();
      c.fill();
      c.stroke();
      c.fillStyle = '#ff3d6e';
      c.beginPath(); c.arc(0, y0 - s * 0.07, s * 0.045, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#3ad1ff';
      c.beginPath(); c.arc(-s * 0.15, y0 - s * 0.05, s * 0.03, 0, Math.PI * 2); c.arc(s * 0.15, y0 - s * 0.05, s * 0.03, 0, Math.PI * 2); c.fill();
      break;
    }
    case 'party': {
      const bx0 = -s * 0.22, bx1 = s * 0.12, by = top + 4, ax = -s * 0.1, ay = top - s * 0.42;
      c.beginPath();
      c.moveTo(bx0, by); c.lineTo(ax, ay); c.lineTo(bx1, by); c.closePath();
      c.fillStyle = '#ff5d9e';
      c.fill();
      c.save();
      c.clip();
      c.strokeStyle = '#ffe066';
      c.lineWidth = s * 0.07;
      for (let i = 1; i <= 3; i++) {
        const t = i / 4;
        c.beginPath();
        c.moveTo(bx0 - 4, by - (by - ay) * t + 6);
        c.lineTo(bx1 + 4, by - (by - ay) * t - 2);
        c.stroke();
      }
      c.restore();
      c.strokeStyle = 'rgba(0,0,0,0.3)';
      c.lineWidth = 1.2;
      c.stroke();
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(ax, ay, s * 0.07, 0, Math.PI * 2); c.fill();
      break;
    }
    case 'bow': {
      const bx = -s * 0.3, by = top + s * 0.08;
      c.fillStyle = '#ff3d8b';
      c.strokeStyle = '#b8155a';
      c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(bx, by); c.lineTo(bx - s * 0.2, by - s * 0.13); c.lineTo(bx - s * 0.2, by + s * 0.13); c.closePath();
      c.moveTo(bx, by); c.lineTo(bx + s * 0.2, by - s * 0.13); c.lineTo(bx + s * 0.2, by + s * 0.13); c.closePath();
      c.fill();
      c.stroke();
      c.beginPath(); c.arc(bx, by, s * 0.06, 0, Math.PI * 2); c.fill(); c.stroke();
      break;
    }
  }
  c.restore();
}

function drawDog() {
  const { x, y, size } = player;
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(player.rotation);
  drawDogShape(size);
  ctx.restore();
}

function drawShip() {
  const { x, y, size } = player;
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(player.rotation);
  const s = size;

  // wake / thruster churn at the stern when boosting
  if (thrustHeld) {
    ctx.fillStyle = `rgba(255,${150 + Math.random() * 30 | 0},40,0.9)`;
    ctx.beginPath();
    ctx.moveTo(-s * 0.68, -s * 0.06);
    ctx.lineTo(-s * 0.68 - 9 - Math.random() * 4, 0);
    ctx.lineTo(-s * 0.68, s * 0.06);
    ctx.closePath();
    ctx.fill();
  }

  // hull — a stubby grey battleship silhouette
  ctx.shadowColor = 'rgba(140, 160, 180, 0.5)';
  ctx.shadowBlur = 10;
  const hullGrad = ctx.createLinearGradient(0, -s * 0.1, 0, s * 0.34);
  hullGrad.addColorStop(0, '#9aa6b0');
  hullGrad.addColorStop(1, '#48525c');
  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.moveTo(s * 0.66, s * 0.02);
  ctx.lineTo(s * 0.4, -s * 0.1);
  ctx.lineTo(-s * 0.56, -s * 0.1);
  ctx.lineTo(-s * 0.64, s * 0.05);
  ctx.lineTo(-s * 0.5, s * 0.34);
  ctx.lineTo(s * 0.32, s * 0.34);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#2c333a';
  ctx.lineWidth = 2;
  ctx.stroke();

  // deck line
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s * 0.56, -s * 0.1);
  ctx.lineTo(s * 0.4, -s * 0.1);
  ctx.stroke();

  // bow cannon/turret
  ctx.fillStyle = '#3a4048';
  ctx.fillRect(s * 0.2, -s * 0.26, s * 0.15, s * 0.15);
  ctx.fillRect(s * 0.33, -s * 0.21, s * 0.24, s * 0.05);

  // stern mast + flag
  ctx.strokeStyle = '#3a4048';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s * 0.46, -s * 0.1);
  ctx.lineTo(-s * 0.46, -s * 0.34);
  ctx.stroke();
  ctx.fillStyle = '#ff6f61';
  ctx.beginPath();
  ctx.moveTo(-s * 0.46, -s * 0.34);
  ctx.lineTo(-s * 0.32, -s * 0.29);
  ctx.lineTo(-s * 0.46, -s * 0.24);
  ctx.closePath();
  ctx.fill();

  // waterline splash beneath the hull
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(-s * 0.05, s * 0.36, s * 0.5, s * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();

  // the square dog, riding the deck
  ctx.save();
  ctx.translate(-s * 0.05, -s * 0.24);
  drawDogShape(s * 0.6);
  ctx.restore();

  ctx.restore();
}

function drawSpider() {
  const { x, y, size } = player;
  const onCeiling = spiderSide === 'top';
  const colors = getSkinColors();
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  if (onCeiling) ctx.scale(1, -1);
  const s = size;

  // web anchor strand connecting to the surface it's attached to
  ctx.strokeStyle = 'rgba(138,90,43,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -s / 2);
  ctx.lineTo(0, -s / 2 - 8);
  ctx.stroke();

  // legs
  ctx.strokeStyle = colors.outline;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const ang = 0.35 + i * 0.28;
    const dir = i < 2 ? -1 : 1;
    const legY = -s * 0.1 + i * s * 0.14 * (i < 2 ? 1 : -1) * 0 + (i % 2 === 0 ? -s * 0.12 : s * 0.12);
    ctx.beginPath();
    ctx.moveTo(dir * s * 0.28, legY * 0.4);
    ctx.lineTo(dir * s * 0.62, legY * 0.4 - s * 0.22 * Math.sin(frame * 0.3 + i));
    ctx.lineTo(dir * s * 0.85, legY * 0.4 + s * 0.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-dir * s * 0.28, legY * 0.4);
    ctx.lineTo(-dir * s * 0.62, legY * 0.4 - s * 0.22 * Math.sin(frame * 0.3 + i + 1));
    ctx.lineTo(-dir * s * 0.85, legY * 0.4 + s * 0.05);
    ctx.stroke();
  }

  // body (abdomen + head) — same spider silhouette, dog-colored fur
  ctx.shadowColor = 'rgba(255, 215, 107, 0.5)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = colors.body;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.08, s * 0.34, s * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = colors.outline;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = colors.body;
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.22, s * 0.22, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = colors.outline;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // floppy dog ears
  ctx.fillStyle = colors.outline;
  ctx.beginPath();
  ctx.moveTo(-s * 0.16, -s * 0.34);
  ctx.lineTo(-s * 0.3, -s * 0.5);
  ctx.lineTo(-s * 0.06, -s * 0.38);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.16, -s * 0.34);
  ctx.lineTo(s * 0.3, -s * 0.5);
  ctx.lineTo(s * 0.06, -s * 0.38);
  ctx.closePath();
  ctx.fill();

  // snout
  ctx.fillStyle = colors.snout;
  roundRect(-s * 0.13, -s * 0.16, s * 0.26, s * 0.16, 4);
  ctx.fill();
  ctx.fillStyle = colors.nose;
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.05, 3.5, 2.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // eyes
  ctx.fillStyle = colors.eye;
  ctx.beginPath();
  ctx.arc(-s * 0.08, -s * 0.24, 2.8, 0, Math.PI * 2);
  ctx.arc(s * 0.08, -s * 0.24, 2.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFlappy() {
  const { x, y, size } = player;
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(player.rotation);
  const s = size;

  // wing flap animation — flaps up right after a jump, drifts down while falling
  const flapPhase = Math.max(0, 1 - (frame - lastFlapFrame) / 10);
  const wingLift = flapPhase * 0.9;

  ctx.fillStyle = '#fff2df';
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.55, -s * 0.15 - wingLift * s * 0.3, -s * 0.62, s * 0.05 - wingLift * s * 0.15);
  ctx.quadraticCurveTo(-s * 0.35, s * 0.12, -s * 0.1, s * 0.08);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#d8c0a0';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#fff2df';
  ctx.beginPath();
  ctx.moveTo(s * 0.1, -s * 0.05);
  ctx.quadraticCurveTo(s * 0.55, -s * 0.15 - wingLift * s * 0.3, s * 0.62, s * 0.05 - wingLift * s * 0.15);
  ctx.quadraticCurveTo(s * 0.35, s * 0.12, s * 0.1, s * 0.08);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#d8c0a0';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  drawDogShape(s);

  ctx.restore();
}

function drawFrog() {
  const { x, y, size } = player;
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(player.rotation);
  const s = size;
  const squish = player.grounded ? 1 : Math.max(0.75, 1 - Math.abs(player.vy) * 0.01);

  ctx.scale(1 / squish, squish);

  // big folded legs at the sides
  ctx.fillStyle = '#3aa63a';
  ctx.beginPath();
  ctx.ellipse(-s * 0.42, s * 0.22, s * 0.22, s * 0.16, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(s * 0.42, s * 0.22, s * 0.22, s * 0.16, -0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = 'rgba(124, 255, 77, 0.6)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#7cff4d';
  roundRect(-s / 2, -s / 2, s, s, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#3aa63a';
  ctx.lineWidth = 2.5;
  roundRect(-s / 2, -s / 2, s, s, 12);
  ctx.stroke();

  // big froggy eyes on top
  [-1, 1].forEach(dir => {
    ctx.fillStyle = '#eafff0';
    ctx.beginPath();
    ctx.arc(dir * s * 0.22, -s * 0.38, s * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3aa63a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#1a3a0d';
    ctx.beginPath();
    ctx.arc(dir * s * 0.22, -s * 0.4, s * 0.07, 0, Math.PI * 2);
    ctx.fill();
  });

  // wide smile
  ctx.strokeStyle = '#1a3a0d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, s * 0.08, s * 0.22, 0.15, Math.PI - 0.15);
  ctx.stroke();

  ctx.restore();
}

function drawDrone() {
  const { x, y, size } = player;
  ctx.save();
  ctx.translate(x + size / 2, y + size / 2);
  ctx.rotate(player.rotation);
  const s = size;
  const spin = frame * 1.4;

  // arms + spinning propellers
  const armPositions = [[-s * 0.55, -s * 0.35], [s * 0.55, -s * 0.35], [-s * 0.55, s * 0.35], [s * 0.55, s * 0.35]];
  ctx.strokeStyle = '#4a5560';
  ctx.lineWidth = 3;
  armPositions.forEach(p => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  });
  armPositions.forEach(p => {
    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.rotate(spin);
    ctx.fillStyle = 'rgba(102, 224, 255, 0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.22, s * 0.06, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2c333a';
    ctx.beginPath();
    ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // little frame under the dog
  ctx.fillStyle = '#5a626a';
  roundRect(-s * 0.3, s * 0.22, s * 0.6, s * 0.12, 4);
  ctx.fill();

  ctx.translate(0, -s * 0.06);
  drawDogShape(s * 0.78);

  ctx.restore();
}

function drawStar(o) {
  const cx = o.x + o.w / 2;
  const cy = o.y + o.h / 2 + Math.sin(frame * 0.15 + o.x) * 2;
  const spin = frame * 0.05;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(spin);

  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  const spikes = 5;
  const outer = o.w * 0.6;
  const inner = o.w * 0.26;
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / spikes) * i;
    const px = Math.sin(a) * r;
    const py = -Math.cos(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawFrogPullZone(o) {
  const t = (Math.sin(frame * 0.2) + 1) / 2;
  ctx.save();
  ctx.globalAlpha = 0.18 + t * 0.12;
  ctx.fillStyle = '#1a5c2a';
  ctx.fillRect(o.x, CEILING_Y, o.w, GROUND_Y - CEILING_Y);
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = '#7cff4d';
  ctx.lineWidth = 2;
  for (let lx = o.x + 8; lx < o.x + o.w; lx += 18) {
    ctx.beginPath();
    ctx.moveTo(lx, CEILING_Y + 10 + t * 6);
    ctx.lineTo(lx - 5, CEILING_Y + 24 + t * 6);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r, c) {
  c = c || ctx;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// the dog bursts into fur-coloured pieces when it crashes
function spawnDeathBurst() {
  const colors = mode === 'frog' ? { body: '#7cff4d', outline: '#3aa63a' } : getSkinColors();
  const body = typeof colors.body === 'string' ? colors.body : '#e8b06b';
  const cx = player.x + player.size / 2, cy = player.y + player.size / 2;
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 5;
    const life = 35 + Math.floor(Math.random() * 25);
    particles.push({
      x: cx + (Math.random() - 0.5) * player.size * 0.6,
      y: cy + (Math.random() - 0.5) * player.size * 0.6,
      vx: Math.cos(a) * sp - 1, vy: Math.sin(a) * sp - 2,
      life, maxLife: life,
      size: 2.5 + Math.random() * 3.5,
      color: i % 4 === 0 ? colors.outline : i % 7 === 0 ? '#ffffff' : body
    });
  }
}

function spawnFloatText(text, x, y, color) {
  floatTexts.push({ text, x, y, color, life: 55, maxLife: 55 });
}
function drawFloatTexts() {
  if (!floatTexts.length) return;
  ctx.save();
  ctx.font = 'bold 16px "Segoe UI", system-ui, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  for (const t of floatTexts) {
    ctx.globalAlpha = Math.min(1, t.life / (t.maxLife * 0.5));
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.restore();
}

function tickEffects() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += mode === 'ship' ? 0.02 : 0.05;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  for (const t of floatTexts) { t.y -= 0.7; t.life--; }
  floatTexts = floatTexts.filter(t => t.life > 0);
  if (shakeTimer > 0) shakeTimer--;
}

function drawFlash() {
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,80,80,${flashTimer / 20})`;
    ctx.fillRect(0, 0, W, H);
    flashTimer--;
  }
}

// ---------- Update ----------
function update() {
  if (!running) {
    if (gameOver) tickEffects();   // let the crash burst play out behind the crash screen
    return;
  }

  frame++;
  distance += speed;
  score = Math.floor(distance / 12);
  hud.textContent = score;

  const tier = Math.floor(score / SCORE_PER_POINT);
  if (tier > lastPointTier) {
    addBones(tier - lastPointTier);
    lastPointTier = tier;
  }
  maybeScheduleBonusCoin();

  speed = baseSpeed + Math.min(distance, SPEED_RAMP_CAP_DISTANCE) / DIFF.speedRampDiv;

  const onFeet = mode === 'dog' || mode === 'frog';
  const wasGrounded = player.grounded;
  if (onFeet) {
    let g = GRAVITY;
    if (mode === 'frog') {
      // the pull-down zone around every 6th spike row: real extra gravity, not just a taller obstacle
      for (const o of obstacles) {
        if (o.type === 'frogPull' && player.x + player.size > o.x && player.x < o.x + o.w) {
          g = GRAVITY * 1.9;
          break;
        }
      }
    }
    player.vy += g;
    player.y += player.vy;
    // grounded is worked out fresh every frame: the floor here, the top of a block in checkCollisions()
    player.grounded = false;
    if (player.y >= GROUND_LEVEL()) {
      player.y = GROUND_LEVEL();
      player.vy = 0;
      player.grounded = true;
    }
  } else if (mode === 'ship' || mode === 'drone') {
    if (thrustHeld) player.vy -= SHIP_THRUST;
    else player.vy += SHIP_GRAVITY;
    player.vy *= SHIP_DRAG;
    player.vy = Math.max(-SHIP_MAX_V, Math.min(SHIP_MAX_V, player.vy));
    player.y += player.vy;
    if (player.y < CEILING_Y) { player.y = CEILING_Y; player.vy = 0; }
    if (player.y > GROUND_Y - player.size) { player.y = GROUND_Y - player.size; player.vy = 0; }
    player.rotation = Math.max(-0.4, Math.min(0.4, player.vy * 0.07));
    player.grounded = false;
  } else if (mode === 'flappy' || mode === 'balloon') {
    player.vy += FLAP_GRAVITY;
    player.vy = Math.min(player.vy, FLAP_MAX_FALL);
    player.y += player.vy;
    player.rotation = Math.max(-0.5, Math.min(0.9, player.vy * 0.09));
    player.grounded = false;
  } else {
    // spider: stationary except for instant teleports triggered by input
    player.vy = 0;
    player.grounded = false;
  }

  if (grace > 0) grace--;

  if (frame % 3 === 0) spawnTrailParticle();

  collectCoins();
  collectStar();
  collectBalloons();
  for (const o of obstacles) o.x -= speed;
  obstacles = obstacles.filter(o => o.x + o.w > -20 && !((o.type === 'coin' || o.type === 'balloon' || o.type === 'star') && o.collected));
  nextObstacleX -= speed;
  ensureObstacles();
  tickEffects();

  if (checkCollisions()) {
    die();
    return;
  }

  if (onFeet && mode !== 'dog' && mode !== 'frog') return;   // a portal just switched us to a flying mode
  if (onFeet) {
    if (player.grounded) {
      coyote = COYOTE_FRAMES;
      if (!wasGrounded) spawnJumpParticles();
      // a tap buffered just before landing, or a held button, jumps again straight away (on blocks too)
      if (jumpBuffered > 0 || thrustHeld) doJump();
    } else if (coyote > 0) {
      coyote--;
    }
    if (jumpBuffered > 0) jumpBuffered--;
    if (!player.grounded) {
      player.rotation += 0.13;
    } else {
      const target = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
      player.rotation += (target - player.rotation) * 0.3;
    }
  }
}

function renderScene() {
  ctx.clearRect(0, 0, W, H);
  const shaking = shakeTimer > 0;
  if (shaking) {
    const m = shakeTimer * 0.5;
    ctx.save();
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }
  drawBackground();
  for (const o of obstacles) {
    if (o.type === 'frogPull') drawFrogPullZone(o);
  }
  for (const o of obstacles) {
    if (o.type === 'spike') drawSpike(o);
    else if (o.type === 'block') drawBlock(o);
    else if (o.type === 'shipWall') drawShipWall(o);
    else if (o.type === 'spiderWall') drawSpiderWall(o);
    else if (o.type === 'pipeWall') drawPipeWall(o);
    else if (o.type === 'coin') drawCoin(o);
    else if (o.type === 'balloon') drawBalloon(o);
    else if (o.type === 'star') drawStar(o);
    else if (o.type === 'portal') drawPortal(o);
  }
  drawParticles();
  if (!playerExploded) {
    if (mode === 'ship') drawShip();
    else if (mode === 'drone') drawDrone();
    else if (mode === 'spider') drawSpider();
    else if (mode === 'flappy' || mode === 'balloon') drawFlappy();
    else if (mode === 'frog') drawFrog();
    else drawDog();
  }
  drawFloatTexts();
  if (shaking) ctx.restore();
  drawFlash();
}

// ---------- 120Hz (ProMotion) smooth rendering: the game logic stays at 60 updates/sec, but on a 120Hz screen every
// frame is drawn, with positions blended between the previous and current update ----------
let renderAlpha = 1, renderFrac = 1;
function snapInterp() {
  player._px = player.x; player._py = player.y; player._pr = player.rotation;
  for (const o of obstacles) { o._px = o.x; o._py = o.y; }
  for (const p of particles) { p._px = p.x; p._py = p.y; }
}
function lerpObj(o, a) {
  if (typeof o._px === 'number' && typeof o.x === 'number' && o._px !== o.x && Math.abs(o.x - o._px) < 80) { o._cx = o.x; o.x = o._px + (o.x - o._px) * a; o._ix = true; }
  if (typeof o._py === 'number' && typeof o.y === 'number' && o._py !== o.y && Math.abs(o.y - o._py) < 80) { o._cy = o.y; o.y = o._py + (o.y - o._py) * a; o._iy = true; }
}
function unlerpObj(o) {
  if (o._ix) { o.x = o._cx; o._ix = false; }
  if (o._iy) { o.y = o._cy; o._iy = false; }
}
function render() {
  if (renderAlpha >= 1) { renderScene(); return; }
  const a = renderAlpha;
  lerpObj(player, a);
  if (typeof player._pr === 'number' && Math.abs(player.rotation - player._pr) < 3) { player._cr = player.rotation; player.rotation = player._pr + (player.rotation - player._pr) * a; player._ir = true; }
  for (const o of obstacles) lerpObj(o, a);
  for (const p of particles) lerpObj(p, a);
  renderScene();
  unlerpObj(player);
  if (player._ir) { player.rotation = player._cr; player._ir = false; }
  for (const o of obstacles) unlerpObj(o);
  for (const p of particles) unlerpObj(p);
}

// Fixed 60 updates/second no matter the screen's refresh rate (the game logic is tuned per frame).
const STEP_MS = 1000 / 60;
let lastLoopTime = 0, stepAccum = 0, framePeriod = 1000 / 60, interpOn = false;
// Optional URL switches:  ?hz=60 forces plain 60Hz mode,  ?hz=120 forces smooth mode,  ?debug shows a small fps readout
const HZ_FORCE = (() => { try { const m = /[?&]hz=(\d+)/.exec(location.search); return m ? Number(m[1]) : 0; } catch (e) { return 0; } })();
let dbgEl = null, dbgFrames = 0, dbgT = 0;
try { if (/[?&]debug/.test(location.search)) { dbgEl = document.createElement('div'); dbgEl.style.cssText = 'position:absolute;top:4px;left:8px;z-index:9;font:600 11px monospace;color:#9f9;background:rgba(0,0,0,.55);padding:3px 6px;pointer-events:none'; stageEl.appendChild(dbgEl); } } catch (e) {}
function loop(now) {
  requestAnimationFrame(loop);
  if (!now) now = performance.now();
  if (paused) { lastLoopTime = 0; return; }
  if (!lastLoopTime) { lastLoopTime = now; return; }
  const dt = Math.min(now - lastLoopTime, 100);
  lastLoopTime = now;
  if (dt > 3 && dt < 40) framePeriod += (dt - framePeriod) * 0.05;   // smoothed screen refresh interval
  // smooth mode only on a fast (about 90Hz+) screen; hysteresis stops it flipping back and forth
  if (HZ_FORCE) interpOn = HZ_FORCE > 80;
  else if (framePeriod < 12.5) interpOn = true;
  else if (framePeriod > 14.5) interpOn = false;
  if (dbgEl) { dbgFrames++; if (now - dbgT > 1000) { dbgEl.textContent = Math.round(dbgFrames * 1000 / (now - dbgT)) + ' fps · ' + (interpOn ? 'smooth' : '60Hz') + ' · ' + framePeriod.toFixed(1) + 'ms'; dbgFrames = 0; dbgT = now; } }
  if (!interpOn) {
    renderAlpha = 1; renderFrac = 1;
    if (dt > 13.5 && dt < 20.5) { stepAccum = 0; update(); render(); return; }   // a normal 60Hz frame: exactly one update
    stepAccum += dt;
    let steps = 0;
    while (stepAccum >= STEP_MS - 0.5 && steps < 4) { update(); stepAccum -= STEP_MS; steps++; }
    if (stepAccum > STEP_MS) stepAccum = 0;
    if (steps > 0) render();
    return;
  }
  // fast screen: the game logic ticks 60 times a second by REAL time (so dropped frames never slow the game),
  // and every screen frame is drawn blended between the last two updates
  stepAccum += dt;
  let steps = 0;
  while (stepAccum >= STEP_MS && steps < 4) { snapInterp(); update(); stepAccum -= STEP_MS; steps++; }
  if (stepAccum > STEP_MS * 2) stepAccum = 0;
  renderAlpha = Math.min(1, stepAccum / STEP_MS);
  renderFrac = Math.min(2, dt / STEP_MS);
  render();
  renderAlpha = 1; renderFrac = 1;
}

resetPlayer();
showMenu();
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
